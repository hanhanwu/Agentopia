<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title description">
  <title id="title">Agentopia registry concepts version one</title>
  <desc id="description">Reusable visual designs for AgentCensus, A2A Registry, and MCP Registry.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071109"/>
      <stop offset="0.55" stop-color="#09131e"/>
      <stop offset="1" stop-color="#04080e"/>
    </linearGradient>
    <radialGradient id="card-glow" cx="50%" cy="34%" r="72%">
      <stop offset="0" stop-color="currentColor" stop-opacity="0.11"/>
      <stop offset="1" stop-color="currentColor" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#263a48" stroke-width="1" opacity="0.24"/>
    </pattern>
    <filter id="green-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#45ff8a" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="violet-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#aa8cff" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="orange-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#ffad5c" flood-opacity="0.5"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Reusable marks. Each symbol inherits its identity color through currentColor. -->
    <symbol id="agentcensus-registry-mark" viewBox="-82 -82 164 164">
      <circle class="registry-halo" r="73"/>
      <circle class="registry-shell" r="48"/>
      <path class="registry-icon" d="M-24 7A25 25 0 0124 7M-15 7a16 16 0 0130 0M0-28V23M-12 26h24"/>
      <circle class="registry-signal" cy="-4" r="4"/>
    </symbol>
    <symbol id="a2a-registry-mark" viewBox="-82 -82 164 164">
      <circle class="registry-halo" r="73"/>
      <rect class="registry-shell" x="-48" y="-48" width="96" height="96" rx="18"/>
      <path class="registry-icon" d="M-24 24V-22H24V24M-10 24V4H10V24M-13-8h26"/>
    </symbol>
    <symbol id="mcp-registry-mark" viewBox="-82 -82 164 164">
      <circle class="registry-halo" r="73"/>
      <path class="registry-shell" d="M0-52L45-26V26L0 52-45 26V-26Z"/>
      <path class="registry-icon" d="M-20 0H20M-10-15V15M10-15V15M-26-20V20M26-20V20"/>
    </symbol>

    <style>
      .eyebrow { font: 650 16px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 4px; fill: #6f8499; }
      .title { font: 750 46px Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: -1px; fill: #eef8ff; }
      .subtitle { font: 400 18px Inter, ui-sans-serif, system-ui, sans-serif; fill: #8da0b3; }
      .registry-name { font: 800 26px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; fill: currentColor; }
      .registry-type { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 2px; fill: #7890a5; }
      .registry-copy { font: 400 16px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; fill: #8da0b3; }
      .registry-halo { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 5 9; opacity: 0.35; }
      .registry-shell { fill: #0a1710; stroke: currentColor; stroke-width: 3; }
      .registry-icon { fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .registry-signal { fill: currentColor; }
      .token-label { font: 650 13px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; fill: #6f8499; }
      .token-value { font: 700 13px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #d9ebf7; }
    </style>
  </defs>

  <rect width="1500" height="760" fill="url(#background)"/>
  <rect width="1500" height="760" fill="url(#grid)"/>

  <g transform="translate(58 54)">
    <text class="eyebrow">AGENTOPIA · REUSABLE REGISTRY LANGUAGE 01</text>
    <text class="title" y="61">Three registries · three stable outpost identities</text>
    <text class="subtitle" y="100">Keep geometry and identity color fixed across C1, maps, inspectors, and future registry views.</text>
  </g>

  <g transform="translate(58 200)" color="#45ff8a">
    <rect width="430" height="390" rx="28" fill="#09131d" stroke="#294333" stroke-width="2"/>
    <rect width="430" height="390" rx="28" fill="url(#card-glow)"/>
    <g transform="translate(215 120)" filter="url(#green-glow)">
      <use href="#agentcensus-registry-mark" x="-82" y="-82" width="164" height="164"/>
    </g>
    <text class="registry-name" x="28" y="252">AGENTCENSUS</text>
    <text class="registry-type" x="28" y="282">OBSERVATION POINT</text>
    <text class="registry-copy" x="28" y="325">Circle shell · radio-wave mast</text>
    <text class="registry-copy" x="28" y="351">Identity color: green #45FF8A</text>
  </g>

  <g transform="translate(535 200)" color="#aa8cff">
    <rect width="430" height="390" rx="28" fill="#09131d" stroke="#294333" stroke-width="2"/>
    <rect width="430" height="390" rx="28" fill="url(#card-glow)"/>
    <g transform="translate(215 120)" filter="url(#violet-glow)">
      <use href="#a2a-registry-mark" x="-82" y="-82" width="164" height="164"/>
    </g>
    <text class="registry-name" x="28" y="252">A2A REGISTRY</text>
    <text class="registry-type" x="28" y="282">AGENT CARD DIRECTORY</text>
    <text class="registry-copy" x="28" y="325">Rounded-square shell · directory arch</text>
    <text class="registry-copy" x="28" y="351">Identity color: violet #AA8CFF</text>
  </g>

  <g transform="translate(1012 200)" color="#ffad5c">
    <rect width="430" height="390" rx="28" fill="#09131d" stroke="#294333" stroke-width="2"/>
    <rect width="430" height="390" rx="28" fill="url(#card-glow)"/>
    <g transform="translate(215 120)" filter="url(#orange-glow)">
      <use href="#mcp-registry-mark" x="-82" y="-82" width="164" height="164"/>
    </g>
    <text class="registry-name" x="28" y="252">MCP REGISTRY</text>
    <text class="registry-type" x="28" y="282">SERVER DIRECTORY</text>
    <text class="registry-copy" x="28" y="325">Hexagonal shell · connector grid</text>
    <text class="registry-copy" x="28" y="351">Identity color: orange #FFAD5C</text>
  </g>

  <g transform="translate(58 646)">
    <text class="token-label">REUSE:</text>
    <text class="token-value" x="78">#agentcensus-registry-mark</text>
    <text class="token-value" x="380">#a2a-registry-mark</text>
    <text class="token-value" x="635">#mcp-registry-mark</text>
    <text class="token-label" x="925">STATE:</text>
    <text class="token-value" x="995">motion/rings only; keep geometry + color fixed</text>
  </g>
</svg>
